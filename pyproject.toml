[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qiskit-data-reuploading"
version = "0.1.0"
description = "Data re-uploading quantum classifier compatible with Qiskit 2.x — pip-installable, sklearn-compatible"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Carlos Andrés Durán Paredes" },
    { name = "Javier León Calderón" },
]
requires-python = ">=3.10"
keywords = [
    "quantum-computing",
    "quantum-machine-learning",
    "data-reuploading",
    "qiskit",
    "classification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.15",
    "qiskit-machine-learning>=0.9.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
hardware = [
    "qiskit-ibm-runtime>=0.25",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/Carlosandp/qiskit-data-reuploading"
Repository = "https://github.com/Carlosandp/qiskit-data-reuploading"
Issues = "https://github.com/Carlosandp/qiskit-data-reuploading/issues"
Documentation = "https://github.com/Carlosandp/qiskit-data-reuploading#readme"

[tool.hatch.build.targets.wheel]
packages = ["qdr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qdr --cov-report=term-missing --cov-report=xml"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["qdr"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
